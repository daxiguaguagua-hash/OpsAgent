name: opsagent

services:
  postgres:
    image: postgres:16
    container_name: opsagent-postgres
    environment:
      POSTGRES_DB: opsagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - opsagent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opsagent-redis
    ports:
      - "6379:6379"
    volumes:
      - opsagent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: opsagent-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - opsagent_prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    container_name: opsagent-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - opsagent_loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: opsagent-alloy
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/opsagent:ro
      - opsagent_alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: opsagent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_DEFAULT_LANGUAGE=${GRAFANA_DEFAULT_LANGUAGE:-zh-Hans}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - opsagent_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: opsagent-otel-collector
    command:
      - "--config=/etc/otelcol-contrib/config.yml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./observability/otel/collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yml"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.1
    container_name: opsagent-tempo
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - opsagent_tempo_data:/var/tempo
    restart: unless-stopped

  # GlitchTip（Sentry 开源兼容平替，M4-11 spike 引入）
  # 默认不启动，需要时用 `docker compose --profile glitchtip up -d`
  # 详见 docs/milestones/M4/tasks/M4-11-glitchtip-sentry-fallback-spike.md
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: opsagent-glitchtip
    profiles: ["glitchtip"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@postgres:5432/glitchtip
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-IEdxRctfwACQOk9Vpud0yq9xWTF2wW6w1oUYmGWUiUU}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-noreply@opsagent.local}
      EMAIL_URL: consolemail://
      ENABLE_OPEN_USER_REGISTRATION: "true"
      DEFAULT_FROM_EMAIL_IS_VERIFIED: "true"
      # All-in-one 模式：Web + Worker 在同一容器（demo 用；生产环境应分离 worker）
      GLITCHTIP_EMBED_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opsagent_postgres_data:
  opsagent_redis_data:
  opsagent_prometheus_data:
  opsagent_loki_data:
  opsagent_alloy_data:
  opsagent_grafana_data:
  opsagent_tempo_data:
