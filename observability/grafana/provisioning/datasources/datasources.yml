apiVersion: 1

datasources:
  - name: Prometheus
    uid: opsagent-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: opsagent-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: opsagent-tempo
          matcherRegex: '"traceId"\s*:\s*"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: opsagent-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: opsagent-loki
        filterByTraceID: true
        tags: []
      nodeGraph:
        enabled: true
